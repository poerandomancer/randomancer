name: Slim Recommendation Catalog V3

on:
  push:
    branches: [agent/slim-catalog-v3]

permissions:
  contents: write

jobs:
  slim-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preserve pre-slim catalog
        run: cp data/enriched/recommendation_catalog_v3.json /tmp/recommendation_catalog_v3_before.json

      - name: Tighten runtime projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('data/helperScripts/generate_recommendation_catalog_v3.py')
          text = path.read_text()
          replacement = r'''RUNTIME_SUPPORT_ACTION_RELATIONS = {
              "fulfills", "inflicts", "creates", "provides", "generates", "converts",
          }
          RUNTIME_RELEVANT_SOURCE_TAGS = {"kalguuran", "derived_template", "lineage"}
          RUNTIME_NON_SKILL_RETRIEVAL_TERMS = {
              "kalguuran", "prototype", "inaccessible", "dnt", "dnt_unused",
              "coming_soon", "derived_template",
          }
          RUNTIME_DESCRIPTION_EXCLUSION_RE = re.compile(
              r"^\s*\[?(?:DNT(?:-UNUSED)?|UNUSED|Coming\s+Soon)\]?", re.IGNORECASE
          )
          RUNTIME_SUPPORT_ENABLE_RE = re.compile(
              r"(?:causing|allowing) it to inflict|giving it a chance to|base_chance_to_(?:inflict_bleeding|poison_on_hit)",
              re.IGNORECASE,
          )
          RUNTIME_SUPPORT_FALSE_POSITIVE_RE = re.compile(
              r"skills? (?:which|that) can|inflicted (?:by|with)|shocking an enemy|chance_to_(?:shock|ignite)_\+%_final",
              re.IGNORECASE,
          )
          RUNTIME_SUPPORT_POTENCY_RE = re.compile(
              r"causing it to .*inflict more (?:potent|powerful)", re.IGNORECASE
          )
          RUNTIME_UNIQUE_PAYOFF_RE = re.compile(
              r"(?:against|affected by|all\s+\w+\s+enemies|while\s+\w+ed|if\s+\w+ed)", re.IGNORECASE
          )
          RUNTIME_COMPONENT_RE = re.compile(r"explod|cloud|ground|burst|projectile", re.IGNORECASE)


          def _runtime_fact_evidence(fact: dict[str, Any], content_type: str) -> list[dict[str, str]]:
              """Compile verbose proof text to only the semantic markers still consumed after generation."""
              proofs = [
                  proof for proof in fact.get("evidence") or []
                  if str(proof.get("value") or "").strip()
              ]
              if not proofs:
                  return []
              values = [str(proof.get("value") or "").lower() for proof in proofs]

              if content_type == "support_gem" and fact.get("subject") == "supported_skill" \
                      and fact.get("relation") in RUNTIME_SUPPORT_ACTION_RELATIONS:
                  if fact.get("relation") != "inflicts":
                      return [{"value": "runtime"}]
                  enabled = any(
                      RUNTIME_SUPPORT_ENABLE_RE.search(value)
                      and not RUNTIME_SUPPORT_FALSE_POSITIVE_RE.search(value)
                      and not RUNTIME_SUPPORT_POTENCY_RE.search(value)
                      for value in values
                  )
                  return [{"value": "allowing it to inflict" if enabled else "reference only"}]

              if content_type in {"active_skill", "unique"}:
                  first = proofs[0]
                  marker_parts = ["against"] if any(RUNTIME_UNIQUE_PAYOFF_RE.search(value) for value in values) else ["runtime"]
                  component = RUNTIME_COMPONENT_RE.search(str(first.get("value") or ""))
                  if component:
                      marker_parts.append(component.group(0).lower())
                  marker = {"value": " ".join(marker_parts)}
                  if first.get("kind"):
                      marker["kind"] = str(first["kind"])
                  return [marker]
              return []


          def compact_fact(fact: dict[str, Any], content_type: str) -> dict[str, Any]:
              """Project a fully evidenced generation fact onto the browser contract."""
              projected = {key: value for key, value in fact.items() if key != "evidence"}
              runtime_evidence = _runtime_fact_evidence(fact, content_type)
              if runtime_evidence:
                  projected["evidence"] = runtime_evidence
              return projected


          def _runtime_retrieval_terms(entity: dict[str, Any]) -> list[str]:
              terms = entity.get("retrieval_terms") or []
              if entity.get("content_type") in {"active_skill", "support_gem"}:
                  return terms
              return [
                  term for term in terms
                  if normalized_phrase(term) in RUNTIME_NON_SKILL_RETRIEVAL_TERMS
              ]


          def compact_entity(entity: dict[str, Any]) -> dict[str, Any]:
              content_type = entity.get("content_type")
              projected = {
                  key: entity[key]
                  for key in ("id", "content_type", "source_id", "name", "compatibility")
                  if key in entity
              }

              if content_type == "active_skill":
                  projected["candidate_roles"] = entity.get("candidate_roles") or []
              if content_type == "support_gem" and "support_family" in entity:
                  projected["support_family"] = entity["support_family"]

              retrieval_terms = _runtime_retrieval_terms(entity)
              if retrieval_terms:
                  projected["retrieval_terms"] = retrieval_terms

              projected["facts"] = [compact_fact(fact, content_type) for fact in entity.get("facts") or []]

              if content_type == "active_skill":
                  structured = entity.get("structured_weapon_requirements")
                  equipment = (entity.get("compatibility") or {}).get("equipment")
                  if structured is not None and structured != equipment:
                      projected["structured_weapon_requirements"] = structured

              source = entity.get("source_evidence") or {}
              runtime_source: dict[str, Any] = {}
              description = str(source.get("description") or "")
              if description and RUNTIME_DESCRIPTION_EXCLUSION_RE.search(description):
                  runtime_source["description"] = "DNT"
              if content_type == "active_skill" and "active_skill_types" in source:
                  runtime_source["active_skill_types"] = source["active_skill_types"]
                  effects = [
                      {"cannot_be_supported": True}
                      for effect in source.get("granted_effects") or []
                      if effect.get("cannot_be_supported") is True
                  ]
                  if effects:
                      runtime_source["granted_effects"] = effects
              if runtime_source:
                  projected["source_evidence"] = runtime_source

              source_tags = [
                  tag for tag in (entity.get("provenance") or {}).get("source_tags") or []
                  if normalized_phrase(tag) in RUNTIME_RELEVANT_SOURCE_TAGS
              ]
              if source_tags:
                  projected["provenance"] = {"source_tags": source_tags}
              return projected
          '''
          pattern = re.compile(r'RUNTIME_ENTITY_FIELDS = \(.*?\n\ndef compact_catalog', re.S)
          text, count = pattern.subn(lambda _match: replacement + '\n\ndef compact_catalog', text, count=1)
          if count != 1:
              raise SystemExit(f'generator runtime projection replacement count: {count}')
          path.write_text(text)

          path = Path('data/helperScripts/validate_recommendation_catalog_v3.py')
          text = path.read_text()
          old = '''            if not fact.get("evidence"):\n                errors.append(f"{entity_id}: fact has no evidence: {fact}")'''
          new = '''            runtime_evidence = fact.get("evidence") or []\n            if runtime_evidence:\n                if entity.get("content_type") not in {"support_gem", "active_skill", "unique"}:\n                    errors.append(f"{entity_id}: runtime evidence retained for an unused content type: {fact}")\n                if len(runtime_evidence) != 1 or any(set(proof) - {"kind", "value"} for proof in runtime_evidence):\n                    errors.append(f"{entity_id}: runtime evidence is not compact: {fact}")'''
          if old not in text:
              raise SystemExit('validator evidence block not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('data/helperScripts/audit_recommendation_catalog_v3_size.py')
          text = path.read_text()
          old = "  'RUNTIME_REQUIRED':['identity/name/roles/retrieval_terms/support_family','compatibility','typed semantic fact fields','evidence.kind/value','source_evidence.description/active_skill_types/cannot_be_supported','provenance.source_tags'],\n  'GENERATION_REQUIRED':['component/stat-set/parser provenance','complete source evidence','semantic completeness warnings'],\n  'DIAGNOSTIC_ONLY':['entity dataset/schema provenance','evidence parent/component/pattern_category','structured raw stats','passive lines','unique modifiers/source metadata','taxonomy metadata','full granted effects','links'],"
          new = "  'RUNTIME_REQUIRED':['identity/name','active-skill roles/retrieval terms','support family','compatibility','typed semantic fact fields','minimal support/unique-analysis evidence markers','active skill types/cannot_be_supported','eligibility source tags'],\n  'GENERATION_REQUIRED':['full evidence text','descriptions','component/stat-set/parser provenance','complete source evidence','semantic completeness warnings'],\n  'DIAGNOSTIC_ONLY':['entity dataset/schema provenance','evidence parent/component/pattern_category','structured raw stats','passive lines','unique modifiers/source metadata','taxonomy metadata','full granted effects','links'],"
          if old not in text:
              raise SystemExit('size audit classification block not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('docs/recommendation_enrichment_v3.md')
          text = path.read_text()
          text = text.replace(
              '- `data/enriched/recommendation_catalog_v3.json` contains normalized recommendation entities.',
              '- `data/enriched/recommendation_catalog_v3.json` contains the compact browser-facing recommendation entities.'
          )
          text = text.replace('## Entity contract\n', '## Build-time entity contract\n', 1)
          marker = '## Fact contract\n'
          section = '''## Runtime catalog projection\n\nThe generator deliberately builds the rich entity contract above only as a build-time intermediate. The committed `recommendation_catalog_v3.json` is a deterministic runtime projection containing only fields read by the application plus tiny semantic markers required to keep downstream recommendation audits deterministic. Full descriptions, original evidence clauses, raw stats, parser/component provenance, links, and other diagnostic material are not browser payload.\n\nVerbose fact evidence is compiled to short markers. Support markers preserve the selector's affirmative-bridge distinction; active-skill and unique markers preserve only payoff/component classification used by the deterministic unique-semantics audit. Normal skill prose is omitted; only a minimal exclusion marker is retained for DNT/unused content. Active-skill type data, compatibility, access sidecars, crafting metadata, and the typed fact fields used by matching remain authoritative. No additional runtime network request is introduced by this projection; display text continues to come from the existing enriched skill/passive/unique datasets already loaded by the app.\n\nFor investigation during a patch refresh, generate the full developer artifact explicitly with `--provenance-out data/enriched/debug/recommendation_catalog_v3_provenance.json`. That path is gitignored and is intentionally not part of the application or normal Git history.\n\n'''
          if marker not in text:
              raise SystemExit('doc fact-contract marker not found')
          text = text.replace(marker, section + marker, 1)
          path.write_text(text)
          PY

          rm -f .gitattributes

      - name: Regenerate runtime artifacts
        run: python data/helperScripts/generate_recommendation_catalog_v3.py

      - name: Validate semantic catalog
        run: python data/helperScripts/validate_recommendation_catalog_v3.py

      - name: Run recommendation regression tests
        run: |
          node --test tests/recommendation-v3-selector.test.mjs
          node --test tests/non-skill-recommendation-selector.test.mjs
          node --test tests/recommendation-unique-analysis-v3.test.mjs

      - name: Audit size reduction
        run: |
          python data/helperScripts/audit_recommendation_catalog_v3_size.py --before /tmp/recommendation_catalog_v3_before.json
          echo "Before: $(wc -c < /tmp/recommendation_catalog_v3_before.json) bytes"
          echo "After:  $(wc -c < data/enriched/recommendation_catalog_v3.json) bytes"

      - name: Commit validated slimming pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Slim recommendation catalog runtime payload [skip ci]"
          git push
